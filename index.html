<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Oath - Assistant de Chronique</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap");
            body {
                background-color: #0c0a09;
                font-family: "Georgia", serif;
                user-select: none;
            }
            .font-oath {
                font-family: "Cinzel", serif;
            }
            .custom-scroll::-webkit-scrollbar {
                width: 4px;
                height: 4px;
            }
            .custom-scroll::-webkit-scrollbar-thumb {
                background: #444;
                border-radius: 2px;
            }

            /* Conteneur de carte dynamique (Aspect ratio d'origine d'une carte Oath) */
            .oath-card-container {
                width: 105px;
                height: 146px;
                border-radius: 6px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.6);
                background-size: 500% 400%; /* Grille 5x4 des planches */
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
            }
            .oath-card-container:hover {
                transform: translateY(-6px) scale(1.05);
                box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.8);
                z-index: 30;
            }
        </style>
    </head>
    <body
        class="h-screen w-screen overflow-hidden flex flex-col text-stone-200 p-2"
    >
        <div
            id="phase-modal"
            class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        >
            <div
                class="bg-stone-900 border border-stone-800 rounded-xl p-5 max-w-md w-full text-center shadow-2xl"
            >
                <span
                    id="modal-phase-num"
                    class="text-xs uppercase tracking-widest text-amber-500 font-bold block mb-1"
                ></span>
                <h2
                    id="modal-phase-title"
                    class="font-oath text-lg font-bold text-stone-100 uppercase mb-3"
                ></h2>
                <div
                    id="modal-phase-body"
                    class="text-xs text-stone-400 text-left bg-stone-950 p-3 rounded border border-stone-800 mb-4"
                ></div>
                <button
                    onclick="
                        document
                            .getElementById('phase-modal')
                            .classList.add('hidden')
                    "
                    class="w-full bg-amber-800 hover:bg-amber-700 text-stone-100 py-2.5 rounded-lg font-oath text-xs uppercase tracking-wider font-bold"
                >
                    Confirmer et Ouvrir
                </button>
            </div>
        </div>

        <header
            class="w-full bg-stone-900/40 border border-stone-800/60 rounded-lg p-2 mb-1.5 flex justify-between items-center shrink-0"
        >
            <div class="flex items-center gap-3">
                <h1
                    class="font-oath text-base font-bold text-amber-600 tracking-wider"
                >
                    OATH CHRONICLE
                </h1>
                <div
                    id="phase-indicator"
                    class="bg-stone-950 border border-stone-800 text-stone-400 text-[11px] font-mono px-3 py-0.5 rounded-full"
                ></div>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-3 gap-2 min-h-0 mb-1.5">
            <section
                id="board-locations"
                class="col-span-2 bg-stone-950/40 border border-stone-900 rounded-xl p-2 flex flex-row gap-3 min-h-0 h-full"
            ></section>
        </div>
    </body>
</html>
